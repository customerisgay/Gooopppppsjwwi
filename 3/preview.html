<!DOCTYPE html>
<html lang="en" data-design="soft">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Zoro TG Store — Store Mini App (Design 3)</title>
<style>
:root{
  --bg:#f5f6f8; --bg2:#ffffff; --card:#ffffff; --card2:#f1f3f7;
  --line:#e6e8ee; --tx:#161821; --tx2:#767b8a; --acc:#2f6bff; --acc2:#2f6bff;
  --ok:#12a56a; --warn:#e08a00; --bad:#e2445c;
  --r:20px; --rs:16px; --btnh:44px; --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; --fhead:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --shadow:0 4px 18px rgba(20,25,45,.06); --pillgrad:linear-gradient(135deg,#2f6bff,#5b8cff); --btnbg:#2f6bff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:var(--font);font-size:15px;line-height:1.45;min-height:100vh;overflow-x:hidden;padding-top:32px;}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;}
::-webkit-scrollbar{width:0;height:0}
#shell{position:relative;z-index:1;max-width:520px;margin:0 auto;min-height:100vh;padding:0 16px 112px}
.hidden{display:none!important}

#topbar{position:sticky;top:32px;z-index:40;display:flex;align-items:center;gap:10px;padding:14px 0 12px;background:linear-gradient(var(--bg) 72%,transparent)}
.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto;background:var(--pillgrad);color:#ffffff;font-weight:800;font-size:.9rem;letter-spacing:-.03em;}
.brand{min-width:0;flex:1}
.brand b{display:block;font-family:var(--fhead);font-size:.95rem;font-weight:800;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{display:block;font-size:.66rem;color:var(--tx2);letter-spacing:.06em;text-transform:uppercase}
.balchip{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 13px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--tx);font-family:var(--font);font-weight:700;font-size:.85rem;white-space:nowrap;cursor:pointer;}
.balchip .plus{display:grid;place-items:center;width:20px;height:20px;border-radius:7px;background:var(--pillgrad);color:#ffffff;font-weight:800;font-size:.8rem;line-height:1}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow);}
.card.tight{padding:13px}
.card h3{margin:0 0 3px;font-family:var(--fhead);font-size:.92rem;font-weight:800;letter-spacing:-.03em}
.card .sub{margin:0;color:var(--tx2);font-size:.78rem}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 2px 10px}
.sec h2{margin:0;font-family:var(--fhead);font-size:.82rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--tx2)}
.sec a{font-size:.75rem;color:var(--acc);text-decoration:none;font-weight:600;white-space:nowrap;cursor:pointer}

/* one button system — text can never overflow */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:var(--btnh);min-width:0;max-width:100%;padding:0 16px;border:0;cursor:pointer;border-radius:14px;font-family:var(--font);font-size:.83rem;font-weight:700;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1;background:var(--pillgrad);color:#ffffff;transition:transform .15s,filter .15s;}
.btn:active{transform:scale(.97)}
.btn:hover{filter:brightness(1.06)}
.btn svg{width:16px;height:16px;flex:0 0 auto}
.btn.block{display:flex;width:100%}
.btn.sm{height:36px;padding:0 12px;font-size:.75rem;border-radius:11px}
.btn.xs{height:30px;padding:0 10px;font-size:.7rem;border-radius:11px}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line)}
.btn.soft{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.btn.bad{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btnrow{display:flex;gap:8px}
.btnrow>.btn{flex:1 1 0;min-width:0}

.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:99px;font-size:.66rem;font-weight:700;letter-spacing:.04em;background:var(--card2);color:var(--tx2);border:1px solid var(--line);white-space:nowrap}
.pill.on{color:var(--ok);border-color:rgba(18,165,106,.4)}
.pill.hot{color:var(--warn);border-color:rgba(224,138,0,.4)}
.pill.off{color:var(--bad);border-color:rgba(226,68,92,.4)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.kv{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.82rem;color:var(--tx2)}
.kv:last-child{border-bottom:0}
.kv b{color:var(--tx);font-weight:700;text-align:right;overflow-wrap:anywhere}
.flag{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:1.35rem;flex:0 0 auto;background:var(--card2);border:1px solid var(--line)}
.flag svg{width:18px;height:18px}

.hero{position:relative;overflow:hidden;border-radius:24px;padding:22px 18px;margin:4px 0 14px;border:1px solid var(--line);background:linear-gradient(140deg,#eef3ff,#ffffff);border-color:#e3eaff}
.hero .kick{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);font-weight:800}
.hero h1{margin:8px 0 6px;font-family:var(--fhead);font-size:1.75rem;line-height:1.05;letter-spacing:-.03em;font-weight:800}
.hero p{margin:0 0 14px;font-size:.8rem;color:var(--tx2);max-width:280px}
.hero .btnrow{max-width:330px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:9px;cursor:pointer;}
.pcard .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pcard .nm{font-weight:700;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .meta{font-size:.68rem;color:var(--tx2)}
.pcard .price{font-family:var(--fhead);font-size:1.25rem;font-weight:800;letter-spacing:-.02em}
.pcard .price s{font-size:.72rem;color:var(--tx2);font-weight:400;margin-right:6px}
.rows{display:flex;flex-direction:column;gap:9px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s;}
.row:active{transform:scale(.99)}
.row .mid{flex:1;min-width:0}
.row .mid b{display:block;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .mid small{display:block;font-size:.7rem;color:var(--tx2);margin-top:2px}
.row .rt{text-align:right;flex:0 0 auto}
.row .rt .p{font-weight:800;font-size:.95rem;white-space:nowrap}
.row .rt .p s{font-weight:400;font-size:.72rem;color:var(--tx2);margin-right:5px}
.carou{display:flex;gap:10px;overflow-x:auto;padding:2px 0 6px;margin:0 -16px 6px;padding-left:16px;padding-right:16px;scroll-snap-type:x mandatory}
.carou>*{flex:0 0 172px;scroll-snap-align:start}

nav#tabs{position:fixed;z-index:60;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:calc(100vw - 20px)}
nav#tabs .dock{display:flex;gap:2px;padding:7px 8px;border-radius:24px;background:rgba(255,255,255,.92);border:1px solid var(--line);backdrop-filter:blur(16px);box-shadow:0 8px 30px rgba(20,25,45,.12)}
nav#tabs button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:58px;height:48px;padding:0 6px;border:0;background:transparent;cursor:pointer;color:var(--tx2);font-family:var(--font);font-size:.6rem;font-weight:700;letter-spacing:.03em;border-radius:16px;transition:color .2s,background .2s;white-space:nowrap}
nav#tabs button svg{width:19px;height:19px}
nav#tabs button.on{color:#ffffff;background:var(--pillgrad)}

.subnav{display:flex;gap:7px;overflow-x:auto;padding:2px 0 12px;margin:0 -2px}
.subnav button{flex:0 0 auto;height:34px;padding:0 13px;border-radius:11px;border:1px solid var(--line);background:var(--card2);color:var(--tx2);font-family:var(--font);font-size:.74rem;font-weight:700;cursor:pointer;white-space:nowrap}
.subnav button.on{background:var(--pillgrad);color:#ffffff;border-color:transparent}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--rs);padding:13px;box-shadow:var(--shadow)}
.kpi small{display:block;font-size:.64rem;color:var(--tx2);letter-spacing:.1em;text-transform:uppercase}
.kpi b{display:block;margin-top:5px;font-family:var(--fhead);font-size:1.35rem;font-weight:800;letter-spacing:-.02em}
.inp,select.inp{width:100%;height:var(--btnh);padding:0 13px;border-radius:14px;border:1px solid var(--line);background:var(--card2);color:var(--tx);font-family:var(--font);font-size:.83rem;outline:none;-webkit-appearance:none;appearance:none}
select.inp{background-image:none}
.inp::placeholder{color:var(--tx2);opacity:.75}
.inp:focus{border-color:var(--acc)}
textarea.inp{height:auto;min-height:40px;padding:10px 13px;line-height:1.5;resize:vertical}
.cmsrow.hide{display:none}
.iconchip{position:relative;height:34px;min-width:34px;padding:0 9px;border-radius:99px;border:1px solid var(--line);background:var(--card2);color:var(--tx);display:inline-grid;place-items:center;cursor:pointer}
.iconchip svg{width:17px;height:17px}
.iconchip i{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--acc);color:#ffffff;font-size:.6rem;font-style:normal;font-weight:800;display:grid;place-items:center}
.stars{display:inline-flex;gap:1px;vertical-align:middle}
.stars svg{width:11px;height:11px;color:#f5a623}
.stars b{font-size:.66rem;color:var(--tx2);font-weight:700;margin-left:3px}
.heart{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:99px;display:grid;place-items:center;border:1px solid var(--line);background:var(--card2);cursor:pointer;z-index:2}
.heart svg{width:13px;height:13px;color:var(--tx2)}
.heart.on{background:var(--acc);border-color:transparent}
.heart.on svg{color:#ffffff}
.qty{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.qty button{width:38px;height:38px;border:0;background:var(--card2);color:var(--tx);font-size:1rem;font-weight:800;cursor:pointer}
.qty b{min-width:38px;text-align:center;font-size:.85rem}
.tl{margin:10px 0 0;padding-left:16px;border-left:2px solid var(--line)}
.tl div{position:relative;padding:0 0 11px 10px;font-size:.74rem;color:var(--tx2)}
.tl div:last-child{padding-bottom:0}
.tl div::before{content:"";position:absolute;left:-21px;top:4px;width:8px;height:8px;border-radius:99px;background:var(--line)}
.tl div.ok::before{background:var(--ok)}
.tl div.ok b{color:var(--tx)}
.tl small{display:block;font-size:.66rem;opacity:.8}
.fcard{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.fcard:last-child{border-bottom:0}
.fcard .t{flex:1;min-width:0}
.fcard .t b{font-size:.81rem;display:block}
.fcard .t small{display:block;font-size:.69rem;color:var(--tx2);line-height:1.45;margin-top:2px}
.frow.hide,.fgrp.hide{display:none}
.bars{display:flex;align-items:flex-end;gap:5px;height:86px;margin-top:12px}
.bars i{flex:1;border-radius:6px 6px 3px 3px;background:var(--pillgrad);display:block}
.funnel div{display:flex;align-items:center;gap:9px;margin-top:9px;font-size:.74rem}
.funnel i{height:26px;border-radius:7px;background:var(--pillgrad);display:block}
.feedline{display:flex;align-items:center;gap:9px;font-size:.73rem;color:var(--tx2);padding:7px 0;border-bottom:1px solid var(--line)}
.feedline:last-child{border-bottom:0}
.feedline b{color:var(--tx)}
.lb{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.lb:last-child{border-bottom:0}
.lb .rk{width:24px;height:24px;border-radius:99px;display:grid;place-items:center;font-size:.7rem;font-weight:800;background:var(--card2);color:var(--tx2)}
.lb .rk.g{background:var(--pillgrad);color:#ffffff}
.cmsgrp.hide{display:none}
.cmsrow label b{color:var(--acc);font-weight:700}
.timerbar{height:5px;border-radius:99px;background:var(--card2);overflow:hidden;margin:10px 0 2px}
.timerbar i{display:block;height:100%;background:var(--pillgrad);transition:width 1s linear}
.timerbar.low i{background:var(--bad,#e5484d)}
.field{margin-bottom:9px}
.field label{display:block;font-size:.68rem;color:var(--tx2);letter-spacing:.09em;text-transform:uppercase;margin:0 0 5px 2px;font-weight:700}
.swap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.swap:last-child{border-bottom:0}
.swap .t{font-size:.82rem;font-weight:600;min-width:0}
.swap .t small{display:block;font-weight:400;font-size:.7rem;color:var(--tx2)}
.tg{width:44px;height:26px;border-radius:99px;background:var(--card2);border:1px solid var(--line);position:relative;cursor:pointer;flex:0 0 auto}
.tg:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--tx2);transition:.22s}
.tg.on{background:var(--pillgrad);border-color:transparent}
.tg.on:after{left:21px;background:#ffffff}
.tg.sm{width:36px;height:21px}
.tg.sm:after{width:14px;height:14px;top:2.5px}
.tg.sm.on:after{left:18px}
.star{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;border:1px solid var(--line);background:var(--card2);color:var(--tx2);cursor:pointer;flex:0 0 auto}
.star.on{background:var(--pillgrad);color:#ffffff;border-color:transparent}
.star svg{width:14px;height:14px}

#sheet{position:fixed;inset:0;z-index:90;display:none}
#sheet.open{display:block}
#sheet .bg{position:absolute;inset:0;background:rgba(20,24,40,.35);backdrop-filter:blur(3px)}
#sheet .panel{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:520px;background:var(--bg2);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.9,.3,1);max-height:92vh;overflow:auto}
@keyframes up{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}
#sheet .grab{width:38px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.otpbox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.6rem;letter-spacing:.35em;text-align:center;padding:16px;border-radius:var(--rs);background:var(--card2);border:1px dashed var(--line);margin:10px 0}
.qr{width:150px;height:150px;margin:6px auto 10px;border-radius:var(--rs);background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;color:var(--tx2);font-size:.65rem;letter-spacing:.1em;text-align:center}
.steps{margin:12px 0 4px}
.step{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:.79rem;color:var(--tx2)}
.step i{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:.65rem;font-weight:800;flex:0 0 auto}
.step.on{color:var(--tx)}
.step.on i{background:var(--pillgrad);color:#ffffff;border-color:transparent}
.step.run i{border-color:var(--acc);color:var(--acc);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:120;background:var(--bg2);border:1px solid var(--line);color:var(--tx);padding:11px 16px;border-radius:99px;font-size:.78rem;font-weight:600;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}

/* preview chrome — mockup only, own strip so it never overlaps the UI */
#sw{position:fixed;top:0;left:0;right:0;height:32px;z-index:200;display:flex;align-items:center;justify-content:center;gap:5px;
  background:rgba(255,255,255,.85);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
#sw em{font-style:normal;font-size:.56rem;letter-spacing:.18em;text-transform:uppercase;color:var(--tx2);margin-right:4px}
#sw button{height:22px;padding:0 12px;border-radius:99px;border:0;cursor:pointer;background:transparent;color:var(--tx2);font-family:var(--font);font-size:.6rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
#sw button.on{background:var(--pillgrad);color:#ffffff}

/* ═══════════════ AURORA UI KIT — ported components ═══════════════ */
@property --ga{syntax:"<angle>";initial-value:0deg;inherits:false}
@property --gp{syntax:"<percentage>";initial-value:5%;inherits:false}
@property --go{syntax:"<angle>";initial-value:0deg;inherits:false}

/* 23 · Shiny CTA — conic border + dot mask + inner shimmer + breathe */
.btn.cta{--dur:3.2s;--hl:#cfe0ff;position:relative;isolation:isolate;border:1px solid transparent;
  background:linear-gradient(var(--btnbg),var(--btnbg)) padding-box,
    conic-gradient(from calc(var(--ga) - var(--go)),transparent,var(--hl) var(--gp),
      #fff calc(var(--gp)*2),var(--hl) calc(var(--gp)*3),transparent calc(var(--gp)*4)) border-box;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);
  transition:--go .8s cubic-bezier(.25,1,.5,1),--gp .8s cubic-bezier(.25,1,.5,1),transform .15s;
  animation:ga var(--dur) linear infinite}
.btn.cta:before,.btn.cta:after{content:"";position:absolute;left:50%;top:50%;translate:-50% -50%;z-index:-1;pointer-events:none}
.btn.cta:before{width:calc(100% - 6px);height:calc(100% - 6px);border-radius:inherit;opacity:.35;
  background:radial-gradient(circle at 2px 2px,#fff .5px,transparent 0) padding-box;background-size:4px 4px;
  -webkit-mask-image:conic-gradient(from calc(var(--ga) + 45deg),#000,transparent 10% 90%,#000);
  mask-image:conic-gradient(from calc(var(--ga) + 45deg),#000,transparent 10% 90%,#000)}
.btn.cta:after{width:100%;aspect-ratio:1;opacity:.55;
  background:linear-gradient(-50deg,transparent,var(--hl),transparent);
  -webkit-mask-image:radial-gradient(circle at bottom,transparent 40%,#000);
  mask-image:radial-gradient(circle at bottom,transparent 40%,#000);
  animation:shimmer var(--dur) linear infinite}
.btn.cta:hover{--gp:22%;--go:95deg}
.btn.cta:active{translate:0 1px}
@keyframes ga{to{--ga:360deg}}
@keyframes shimmer{to{rotate:360deg}}

/* 22 · Liquid glass */
.btn.glass,.glasscard{position:relative;background:color-mix(in srgb,var(--card2) 70%,transparent);
  border:1px solid color-mix(in srgb,#fff 16%,var(--line));color:var(--tx);
  backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);
  box-shadow:inset 1px 1px 1px -.5px rgba(255,255,255,.55),inset -1px -1px 1px -.5px rgba(255,255,255,.3),
    inset 0 0 8px 6px rgba(255,255,255,.07),0 2px 10px rgba(0,0,0,.12)}
.btn.glass:after{content:"";position:absolute;inset:1px 1px auto;height:42%;border-radius:inherit;
  background:linear-gradient(180deg,rgba(255,255,255,.34),transparent);pointer-events:none}
.btn.glass:hover{transform:scale(1.03)}

/* press ripple (kit dock/button feel) */
.rip{position:absolute;border-radius:50%;transform:translate(-50%,-50%) scale(0);pointer-events:none;
  background:radial-gradient(circle,rgba(255,255,255,.55),transparent 70%);animation:rip .55s ease-out forwards}
@keyframes rip{to{transform:translate(-50%,-50%) scale(1);opacity:0}}

/* 24 · Animated banner + 17 · logo cloud marquee */
.banner{position:relative;overflow:hidden;border-radius:14px;border:1px solid var(--line);
  background:var(--card);margin:2px 0 12px;height:38px;display:flex;align-items:center;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.banner .track{display:flex;gap:30px;white-space:nowrap;animation:marq 26s linear infinite;will-change:transform}
.banner:hover .track{animation-play-state:paused}
.banner span{font-size:.7rem;color:var(--tx2);font-weight:600;letter-spacing:.03em;display:inline-flex;align-items:center;gap:6px}
.banner span b{color:var(--acc)}
.banner span svg{width:13px;height:13px;color:var(--acc)}
@keyframes marq{to{transform:translateX(-50%)}}
.cloud{display:flex;gap:26px;overflow:hidden;padding:4px 0 2px;

.cloud .t{display:flex;gap:26px;animation:marq 30s linear infinite}
.cloud i{font-style:normal;font-size:.68rem;font-weight:800;letter-spacing:.14em;color:var(--tx2);opacity:.55;white-space:nowrap}

/* 07 · Gradient tracing */
.trace{display:block;width:100%;height:10px;margin:-2px 0 8px;overflow:visible}
.trace .base{stroke:var(--line);stroke-width:1.4}
.trace .lead{stroke-width:1.8;stroke-linecap:round}
.sec h2{position:relative}

/* 01 + 13 · Dot loader */
.dotgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;width:70px}
.dotgrid i{width:100%;aspect-ratio:1;border-radius:2px;background:color-mix(in srgb,var(--tx) 14%,transparent);transition:background .12s,transform .12s}
.dotgrid i.act{background:var(--acc);transform:scale(1.12)}
.dots{display:inline-flex;gap:4px;align-items:center}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--acc);animation:bounce 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.35}40%{transform:translateY(-5px);opacity:1}}

/* splash */
#splash{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:var(--bg);transition:opacity .5s ease,visibility .5s}
#splash.gone{opacity:0;visibility:hidden}
#splash .mark{width:58px;height:58px;border-radius:12px;display:grid;place-items:center;background:var(--pillgrad);
  color:#ffffff;font-weight:800;font-size:1.1rem;animation:markin .7s cubic-bezier(.2,1.4,.4,1) both}
#splash h4{margin:0;font-family:var(--fhead);font-size:1rem;font-weight:800;letter-spacing:-.03em;
  animation:fadeup .6s .15s both}
#splash small{color:var(--tx2);font-size:.65rem;letter-spacing:.22em;text-transform:uppercase;animation:fadeup .6s .25s both}
@keyframes markin{from{opacity:0;transform:scale(.6) rotate(-12deg)}to{opacity:1;transform:none}}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* 08 · Kinetic grid canvas */
#kg{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.28}

/* staggered reveal is driven by the Web Animations API (cannot clash with theme CSS) */

/* 02 + 25 · Dock with spring pill */
nav#tabs .dock{position:relative}
nav#tabs .dpill{position:absolute;left:0;top:0;z-index:0;border-radius:16px;background:var(--pillgrad);
  box-shadow:0 6px 18px color-mix(in srgb,var(--acc) 35%,transparent);pointer-events:none}
nav#tabs button{position:relative;z-index:1;will-change:transform;
  transition:color .26s cubic-bezier(.22,1,.36,1),transform .18s cubic-bezier(.3,1.5,.5,1)}
nav#tabs button.on{background:transparent;color:#ffffff}
nav#tabs .dpill{opacity:0}
nav#tabs .dpill.ready{opacity:1}

/* 14 · V-tabs sliding indicator */
.subnav{position:relative}
.subnav .vpill{position:absolute;left:0;top:0;z-index:0;border-radius:11px;background:var(--pillgrad);transition:none;pointer-events:none}
.subnav button{position:relative;z-index:1}
.subnav button.on{background:transparent;color:#ffffff;border-color:transparent}

/* 15 · Animated profile card — tilt + glare */
.tilt{transform-style:preserve-3d;transition:transform .35s cubic-bezier(.22,1,.36,1);will-change:transform}
.tilt .glare{position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.22),transparent 60%)}
.tilt:hover .glare{opacity:1}
.shinecard{position:relative;overflow:hidden}
.shinecard:before{content:"";position:absolute;top:-60%;left:-30%;width:55%;height:220%;transform:rotate(18deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent);animation:cardshine 5.5s ease-in-out infinite;pointer-events:none}
@keyframes cardshine{0%,70%{left:-40%}100%{left:120%}}

/* 05 · Hold action button */
.hold{position:relative;overflow:hidden}
.hold .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.25);transition:width .05s linear}
.hold.done{animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{50%{transform:scale(1.04)}}

/* 11 · Morphing search */
.msearch{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.msearch .fieldwrap{flex:1;min-width:0;position:relative;height:40px}
.msearch input{width:100%;height:40px;padding:0 13px 0 36px;border-radius:99px;border:1px solid var(--line);
  background:var(--card);color:var(--tx);font-family:var(--font);font-size:.8rem;outline:none;
  transition:box-shadow .3s cubic-bezier(.22,1,.36,1),border-color .3s}
.msearch input:focus{border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 16%,transparent)}
.msearch svg{position:absolute;left:12px;top:11px;width:17px;height:17px;color:var(--tx2);transition:color .25s}
.msearch input:focus+svg,.msearch .fieldwrap:focus-within svg{color:var(--acc)}
.chiprow{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px}
.chiprow button{flex:0 0 auto;height:30px;padding:0 12px;border-radius:99px;border:1px solid var(--line);
  background:var(--card2);color:var(--tx2);font-family:var(--font);font-size:.7rem;font-weight:700;cursor:pointer;white-space:nowrap;
  transition:transform .2s cubic-bezier(.3,1.5,.5,1),background .2s,color .2s}
.chiprow button.on{background:var(--pillgrad);color:#ffffff;border-color:transparent;transform:scale(1.04)}

/* skeletons (13 · loader) */
.sk{position:relative;overflow:hidden;background:var(--card2);border-radius:var(--rs);height:74px;margin-bottom:9px}
.sk:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--tx) 10%,transparent),transparent);
  transform:translateX(-100%);animation:shim 1.15s infinite}
@keyframes shim{to{transform:translateX(100%)}}

/* 19 · Feature strip */
.feats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.feat{background:var(--card);border:1px solid var(--line);border-radius:var(--rs);padding:11px 9px;text-align:center;
  transition:transform .25s cubic-bezier(.22,1,.36,1)}
.feat:hover{transform:translateY(-3px)}
.feat svg{width:17px;height:17px;color:var(--acc)}
.feat b{display:block;font-size:.68rem;margin-top:5px}
.feat small{display:block;font-size:.6rem;color:var(--tx2)}

/* 03 · Works wheel — rotating deal dial */
.wheel{position:relative;height:118px;margin:2px 0 12px;overflow:hidden;border-radius:var(--r);
  border:1px solid var(--line);background:var(--card)}
.wheel .ring{position:absolute;right:-52px;top:50%;width:176px;height:176px;margin-top:-88px;border-radius:50%;
  border:1px dashed var(--line);animation:spin 26s linear infinite}
.wheel .ring b{position:absolute;left:50%;top:50%;width:50px;height:24px;margin:-12px 0 0 -25px;border-radius:99px;
  display:grid;place-items:center;font-size:.62rem;font-weight:800;background:var(--card2);border:1px solid var(--line);color:var(--tx2)}
.wheel .cap{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 16px;
  background:linear-gradient(90deg,var(--card) 0 58%,transparent)}
.wheel .cap>*{max-width:62%}
.wheel .cap em{font-style:normal;font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--acc);font-weight:800}
.wheel .cap b{font-family:var(--fhead);font-size:1.05rem;font-weight:800}
@keyframes spin{to{transform:rotate(360deg)}}

/* success burst */
#fx{position:fixed;inset:0;z-index:150;display:none;place-items:center;pointer-events:none}
#fx.on{display:grid}
#fx .ring{width:82px;height:82px;border-radius:50%;border:2px solid var(--ok);display:grid;place-items:center;
  color:var(--ok);animation:burst .75s cubic-bezier(.2,1.3,.4,1)}
#fx .ring svg{width:34px;height:34px}
#fx .wave{position:absolute;width:82px;height:82px;border-radius:50%;border:2px solid var(--ok);animation:wave .9s ease-out forwards}
@keyframes burst{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes wave{to{transform:scale(3.4);opacity:0}}

/* number ticker */
.tick{font-variant-numeric:tabular-nums}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

let QTY=1,COUPON=0;
function buySheet(s,pre){
  QTY=1;COUPON=0;
  const max=FEAT.cart||FEAT.bulkDisc?Math.max(1,Math.min(25,s.qty||5)):1;
  sheet(`<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
      <div class="flag" style="width:50px;height:50px;font-size:1.5rem">${s.f}</div>
      <div style="flex:1"><h3 style="margin:0;font-size:1rem">${esc(s.c)} Account</h3>
      <p class="sub" style="margin:0">${s.code} · ${s.qty+" in stock · instant"}</p>
      ${G("reviews",`<div style="margin-top:4px">${stars(s.c)}</div>`)}</div></div>
    ${G("healthCheck",`<div class="kv"><span>Session health</span><b style="color:var(--ok)">${ic("check")} checked live</b></div>`)}
    ${G("variants",`<div class="kv"><span>Variant</span><b>
      <select class="inp" style="height:32px;width:auto;font-size:.74rem"><option>No 2FA</option><option>2FA on (+₹5)</option><option>With mail (+₹8)</option></select></b></div>`)}
    ${(FEAT.cart||FEAT.bulkDisc)?`<div class="kv"><span>Quantity</span><b>
      <span class="qty"><button id="qm">−</button><b id="qn">1</b><button id="qp">+</button></span></b></div>`:""}
    ${G("bulkDisc",`<p class="sub" id="bdnote" style="margin:6px 0 0;font-size:.7rem">Buy 5+ for 5% off · 10+ for 10% off · 25+ for 15% off.</p>`)}
    ${G("coupons",`<div class="field" style="margin-top:10px"><label>Coupon code</label>
      <div style="display:flex;gap:7px"><input class="inp" id="cpn" placeholder="WELCOME10">
      <button class="btn sm" id="cpnapply" style="flex:0 0 auto">Apply</button></div></div>`)}
    <div class="kv"><span>Price</span><b id="bprice">${money(s.price)}</b></div>
    <div class="kv"><span>Your balance</span><b>${money(BAL)}</b></div>
    <div class="kv"><span>After purchase</span><b id="bafter">${money(Math.max(0,BAL-s.price))}</b></div>
    <div id="splitnote"></div>
    <div class="btnrow" style="margin-top:14px"><button class="btn ghost" data-close>Cancel</button>
      <button class="btn cta" id="bconfirm">Confirm Buy</button></div>
    ${G("cart",`<button class="btn soft block sm" style="margin-top:8px" id="baddcart">Add to cart</button>`)}`);
  const g=id=>document.getElementById(id);
  function total(){
    let unit=s.price, q=QTY, t=unit*q;
    if(FEAT.bulkDisc){const d=q>=25?.15:q>=10?.10:q>=5?.05:0;t=t*(1-d);}
    if(FEAT.coupons&&COUPON)t=t*(1-COUPON/100);
    return Math.round(t*100)/100;
  }
  function paint(){
    const t=total();
    g("bprice").textContent=money(t);
    g("bafter").textContent=money(Math.max(0,BAL-t));
    const sn=g("splitnote");
    if(FEAT.splitPay&&t>BAL){sn.innerHTML=`<div class="kv"><span>Split payment</span><b>${money(BAL)} wallet + ${money(t-BAL)} UPI</b></div>`;}
    else sn.innerHTML="";
    if(g("qn"))g("qn").textContent=QTY;
  }
  if(g("qm"))g("qm").onclick=()=>{QTY=Math.max(1,QTY-1);paint();};
  if(g("qp"))g("qp").onclick=()=>{QTY=Math.min(max,QTY+1);paint();};
  if(g("cpn")&&OFFER&&!g("cpn").value)g("cpn").value=OFFER;
  if(g("cpnapply"))g("cpnapply").onclick=()=>{
    const v=(g("cpn").value||"").trim().toUpperCase();
    if(!v){toast("Enter a coupon code");return}
    COUPON=v==="WELCOME10"?10:v==="SAVE20"?20:0;
    toast(COUPON?COUPON+"% coupon applied":"Coupon not valid");paint();};
  if(g("baddcart"))g("baddcart").onclick=async()=>{
    if(LIVE){
      const d=await apiTry("/api/cart",{action:"add",country:s.c,qty:QTY});
      if(!d)return;
      closeSheet();toast(QTY+" × "+s.c+" added to cart");await refresh();return;
    }
    for(let i=0;i<QTY;i++)CART.push(s);applyFeatures();closeSheet();toast(QTY+" × "+s.c+" added to cart");};
  g("bconfirm").onclick=async()=>{
    const t=total();
    if(BAL<t&&!FEAT.splitPay){toast("Not enough balance — add funds");return}
    if(BAL<t&&FEAT.splitPay){closeSheet();toast("Paying "+money(t-BAL)+" by UPI");depositSheet(Math.ceil(t-BAL));return}
    if(LIVE){
      const btn=g("bconfirm");btn.disabled=true;btn.textContent="Working…";
      const code=g("cpn")?(g("cpn").value||"").trim():"";
      const d=await apiTry("/api/buy",{country:s.c,qty:QTY,coupon:code});
      btn.disabled=false;btn.textContent="Confirm Buy";
      if(!d)return;
      if(typeof d.balance==="number")BAL=d.balance;
      syncBal();closeSheet();burst();
      const first=(d.orders&&d.orders[0])||null;
      toast(first?("Delivered — "+first.id):"Purchased — details in Orders");
      await refresh();
      if(first&&first.payload)setTimeout(()=>sheet(`<h3 style="margin:0 0 4px;font-size:1rem">${esc(first.id)}</h3>
        <p class="sub">Keep this safe. It is also in Orders.</p>
        <div class="kv" style="display:block"><code style="font-size:.72rem;word-break:break-all">${esc(first.payload)}</code></div>
        <button class="btn block" style="margin-top:10px" data-close>Done</button>`),350);
      return;
    }

const RM=matchMedia("(prefers-reduced-motion:reduce)").matches;
/* spring integrator — kit uses mass .1 / stiffness 150 / damping 12 */
function Spring(v,{m=.1,k=150,d=12}={}){this.v=v;this.t=v;this.vel=0;this.m=m;this.k=k;this.d=d;}
Spring.prototype.step=function(dt){const F=-this.k*(this.v-this.t)-this.d*this.vel;
  this.vel+=(F/this.m)*dt;this.v+=this.vel*dt;return this.v;};

/* 08 · kinetic grid — pointer warp + click ripples (canvas port) */
(function kinetic(){
  const cv=document.getElementById("kg");if(!cv||RM)return;const ctx=cv.getContext("2d");
  const SP=30,INF=210,WARP=22,LERP=.09,RGB="47,107,255";
  let W=0,H=0,mouse={x:-9999,y:-9999},tgt={x:-9999,y:-9999},rip=[],raf=0;
  function size(){const d=Math.min(1.6,devicePixelRatio||1);W=innerWidth;H=innerHeight;
    cv.width=W*d;cv.height=H*d;cv.style.width=W+"px";cv.style.height=H+"px";ctx.setTransform(d,0,0,d,0,0);}
  addEventListener("resize",size);size();
  addEventListener("pointermove",e=>{tgt={x:e.clientX,y:e.clientY}},{passive:true});
  addEventListener("pointerdown",e=>{if(rip.length<4)rip.push({x:e.clientX,y:e.clientY,r:0,o:1})},{passive:true});
  addEventListener("pointerleave",()=>tgt={x:-9999,y:-9999});
  function warp(gx,gy,c,r,cols,rows){
    const cp=Math.min(c/1.5,(cols-1-c)/1.5,1),rp=Math.min(r/1.5,(rows-1-r)/1.5,1),pin=cp*cp*rp*rp;
    const dx=gx-mouse.x,dy=gy-mouse.y,dist=Math.hypot(dx,dy);
    const prox=Math.max(0,1-dist/INF)*pin;let rx=0,ry=0;
    for(const p of rip){const ddx=gx-p.x,ddy=gy-p.y,dd=Math.hypot(ddx,ddy),diff=dd-p.r;
      if(Math.abs(diff)<55){const st=(1-Math.abs(diff)/55)*p.o*16*pin,an=Math.atan2(ddy,ddx),sg=diff<0?-1:1;
        rx+=Math.cos(an)*st*sg*-1;ry+=Math.sin(an)*st*sg*-1;}}
    if(dist<INF&&dist>0&&pin>0){const t=dist/INF,e=(1-t)*(1-t)*Math.min(1,dist/60),w=e*WARP*pin,an=Math.atan2(dy,dx);
      return[gx-Math.cos(an)*w+rx,gy-Math.sin(an)*w+ry,prox];}
    return[gx+rx,gy+ry,prox];}
  function frame(){
    mouse.x+=(tgt.x-mouse.x)*LERP;mouse.y+=(tgt.y-mouse.y)*LERP;
    rip=rip.filter(p=>{p.r+=7;p.o-=.016;return p.o>0});
    ctx.clearRect(0,0,W,H);
    const cols=Math.ceil(W/SP)+1,rows=Math.ceil(H/SP)+1,pts=[];
    for(let r=0;r<rows;r++){const row=[];for(let c=0;c<cols;c++)row.push(warp(c*SP,r*SP,c,r,cols,rows));pts.push(row);}
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const p=pts[r][c];
      if(c<cols-1){const q=pts[r][c+1];ctx.strokeStyle="rgba("+RGB+","+(.05+p[2]*.22).toFixed(3)+")";
        ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(q[0],q[1]);ctx.stroke();}
      if(r<rows-1){const q=pts[r+1][c];ctx.strokeStyle="rgba("+RGB+","+(.05+p[2]*.22).toFixed(3)+")";
        ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(q[0],q[1]);ctx.stroke();}
      if(p[2]>.06){ctx.fillStyle="rgba("+RGB+","+(p[2]*.5).toFixed(3)+")";ctx.beginPath();
        ctx.arc(p[0],p[1],1.6+p[2]*1.6,0,6.283);ctx.fill();}}
    raf=requestAnimationFrame(frame);}
  frame();
  document.addEventListener("visibilitychange",()=>{if(document.hidden)cancelAnimationFrame(raf);else frame();});
})();

  const p=+c.dataset.confirm;if(BAL<p){toast("Not enough balance — add funds");return}
  BAL-=p;syncBal();closeSheet();burst();toast("Purchased — OTP is in Orders");});

function renderAdmin(){
  const st=document.getElementById("astage");
  if(!adminAllowed()){st.innerHTML='<div class="card" style="margin:16px;text-align:center">'
    +'<h3 style="margin:0 0 6px">Admins only</h3>'
    +'<p class="sub" style="margin:0">This panel is not available on your account.</p></div>';return;}
  st.innerHTML=({dash:aDash,channels:aChannels,logs:aLogs,pay:aPay,content:aContent,features:aFeatures,market:aMarket,analytics:aAnalytics,security:aSecurity,stock:aStock,orders:aOrders,users:aUsers,settings:aSettings})[ATAB]();
  bindAdmin();revealStage(st);bindTilt();if(window.__vtabPlace)requestAnimationFrame(window.__vtabPlace);}

function bindAdmin(){
  bindCommon();
  document.querySelectorAll("[data-feat]").forEach(t=>t.onclick=()=>{
    const k=t.dataset.feat;FEAT[k]=!FEAT[k];t.classList.toggle("on",FEAT[k]);
    push("/api/admin/feature",{key:k,on:FEAT[k]});
    const c=document.getElementById("fcount");
    if(c)c.textContent=Object.values(FEAT).filter(Boolean).length+" of "+Object.keys(FEAT).length;
    applyFeatures();
    const card=t.closest(".fcard"), nameEl=card?card.querySelector("b"):null;
    const label=nameEl?nameEl.textContent:k.replace(/([A-Z])/g," $1").toLowerCase();
    toast(label+(FEAT[k]?" enabled":" hidden"));});
  const fq=document.getElementById("fq");
  if(fq)fq.oninput=()=>{const q=fq.value.trim().toLowerCase();
    document.querySelectorAll(".frow").forEach(r=>r.classList.toggle("hide",!!q&&!r.dataset.f.includes(q)));
    document.querySelectorAll(".fgrp").forEach(g=>g.classList.toggle("hide",!g.querySelector(".frow:not(.hide)")));};
  const setAll=v=>{Object.keys(FEAT).forEach(k=>FEAT[k]=v);applyFeatures();renderAdmin();toast(v?"All features enabled":"All features hidden");};
  const fa=document.getElementById("fall"),fn=document.getElementById("fnone"),fr=document.getElementById("freset");
  if(fa)fa.onclick=()=>setAll(true);
  if(fn)fn.onclick=()=>setAll(false);
  if(fr)fr.onclick=()=>{Object.assign(FEAT,FEAT0);applyFeatures();renderAdmin();toast("Features reset");};
  const stmsg=m=>{const e=document.getElementById("stmsg");if(e)e.textContent=m;};
  async function importStock(text){
    if(!text.trim()){toast("Paste some lines first");return;}
    if(!LIVE){toast("Preview only");return;}
    stmsg("Importing…");
    const r=await apiTry("/api/admin/stock",{text:text});
    if(!r){stmsg("");return;}
    const note=r.added+" imported"+(r.skipped&&r.skipped.length?(" · "+r.skipped.length+" skipped"):"");
    toast(r.added+" accounts added");
    const box=document.getElementById("stpaste");if(box)box.value="";
    await refresh();
    stmsg(note);
  }
  const stsave=document.getElementById("stsave");
  if(stsave)stsave.onclick=()=>importStock((document.getElementById("stpaste")||{}).value||"");
  const stfile=document.getElementById("stfile");
  if(stfile)stfile.onchange=()=>{
    const f=stfile.files&&stfile.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{const box=document.getElementById("stpaste");
      if(box)box.value=rd.result;stmsg(f.name+" loaded — press Import");};
    rd.readAsText(f);
  };
  const bl=document.getElementById("blblock");
  if(bl)bl.onclick=async()=>{
    const i=document.getElementById("bl-in");
    const v=i?(i.value||"").trim():"";
    if(!v){toast("Type an id, phone or UPI reference");if(i)i.focus();return;}
    if(!LIVE){toast("Preview only");return;}
    const r=await apiTry("/api/admin/blacklist",{action:"add",value:v});
    if(!r)return;
    i.value="";toast("Blocked "+v);await refresh();
  };
  document.querySelectorAll("[data-bl-del]").forEach(b=>b.onclick=async()=>{
    const r=await apiTry("/api/admin/blacklist",{action:"del",id:+b.dataset.blDel});
    if(r){toast("Unblocked");await refresh();}
  });
  document.querySelectorAll("[data-misc]").forEach(b=>b.onclick=async()=>{
    if(!LIVE){toast("Preview only");return;}
    const what=b.dataset.misc, val=b.dataset.miscValue||"";
    const lbl=b.textContent;b.disabled=true;b.textContent="…";
    const r=await apiTry("/api/admin/misc",{what:what,value:val});
    b.disabled=false;b.textContent=lbl;
    if(!r)return;
    if(r.lines)sheet(`<h3 style="margin:0 0 4px;font-size:1rem">Channel check</h3>
      <p class="sub" style="white-space:pre-line">${esc(r.lines.join("\n"))}</p>
      <button class="btn block" style="margin-top:12px" data-close>Close</button>`);
    else if(what==="logtest")toast("Test message sent to the log channel");
    else if(what==="clearstock")toast(r.removed+" removed");
    else toast("Done");
    await refresh();
  });
  const upiadd=document.getElementById("upiadd");
  if(upiadd)upiadd.onclick=async()=>{
    const i=upiadd.closest("div").querySelector("input");
    const v=i?(i.value||"").trim():"";
    if(!v){toast("Paste the extra UPI handle");return;}
    const cur=(ADM.pay&&ADM.pay.extra)||"";
    const r=await apiTry("/api/admin/setting",{key:"upi_extra",value:cur?(cur+","+v):v});
    if(r){i.value="";toast("Handle added");await refresh();}
  };
  const adminadd=document.getElementById("adminadd");
  if(adminadd)adminadd.onclick=async()=>{
    const i=adminadd.closest("div").querySelector("input");
    const v=i?(i.value||"").trim().replace(/^@/,""):"";
    if(!v){toast("Send the numeric user id");return;}
    const r=await apiTry("/api/admin/misc",{what:"addadmin",value:v});
    if(r){i.value="";toast("Admin added with no powers — grant them in the bot");await refresh();}
  };
  const prize=document.getElementById("prizesave");
  if(prize)prize.onclick=async()=>{
    const i=prize.closest("div").querySelector("input");
    const r=await apiTry("/api/admin/setting",{key:"leaderboard_prize",value:(i&&i.value)||"0"});
    if(r)toast("Prize saved");
  };
  const cpadd=document.getElementById("cpadd");
  if(cpadd)cpadd.onclick=async()=>{
    const code=((document.getElementById("cpcode")||{}).value||"").trim();
    const pct=((document.getElementById("cppct")||{}).value||"").trim();
    if(!code||!pct){toast("Code and percent, please");return;}

  document.querySelectorAll("[data-cms]").forEach(t=>{
    t.oninput=()=>{CMS[t.dataset.cms]=t.value;applyCMS();

  const cq=document.getElementById("cq");
  if(cq)cq.oninput=()=>{const q=cq.value.trim().toLowerCase();

  const add=document.getElementById("ch-add");
  if(add)add.onclick=async()=>{

  const lgadd=document.getElementById("lg-add");
  if(lgadd)lgadd.onclick=async()=>{
    const i=document.getElementById("lg-in"),v=(i.value||"").trim();

    if(LIVE){
      lgadd.disabled=true;
      const r=await apiTry("/api/admin/channel",{action:"add",handle:v,log:true});
      lgadd.disabled=false;

      i.value="";await refresh();toast("Log channel saved");return;
    }

  document.querySelectorAll("[data-chdel]").forEach(b=>b.onclick=async()=>{
    if(LIVE){const r=await apiTry("/api/admin/channel",{action:"del",id:+b.dataset.chdel});

  document.querySelectorAll("[data-chreq]").forEach(b=>b.onclick=async()=>{
    if(LIVE){const r=await apiTry("/api/admin/channel",{action:"required",id:+b.dataset.chreq});
      if(r){await refresh();toast("Updated");}return;}
    const c=CHANNELS.find(x=>x.id==b.dataset.chreq);c.req=!c.req;renderAdmin();toast(c.req?"Now required":"Now optional")});
  document.querySelectorAll("[data-chon]").forEach(b=>b.onclick=async()=>{

  document.querySelectorAll("[data-evon]").forEach(b=>b.onclick=()=>{const e=EVENTS[+b.dataset.evon];e.on=!e.on;renderAdmin()});
  document.querySelectorAll("[data-evch]").forEach(s=>s.onchange=()=>{EVENTS[+s.dataset.evch].ch=+s.value;toast("Routing updated")});
  const all=document.querySelector("[data-ev-all]");
  if(all)all.onclick=()=>{const t=!EVENTS.every(e=>e.on);EVENTS.forEach(e=>e.on=t);renderAdmin();toast(t?"All events on":"All events off")};

  if(m)m.onclick=()=>{LOGS_MASTER=!LOGS_MASTER;renderAdmin();toast(LOGS_MASTER?"Logging enabled":"All logging disabled")};
  document.querySelectorAll("[data-a-go]").forEach(b=>b.onclick=()=>{

    ATAB=b.dataset.aGo;renderAdmin();window.scrollTo(0,0);});
  document.querySelectorAll("[data-tg]").forEach(t=>t.onclick=()=>t.classList.toggle("on"));

/* ── live data: everything below comes from the bot database when served by the bot ── */
/* LIVE / ME / TG / INIT are declared at the very top of this script */
async function api(path,body){
  const o={headers:{"Content-Type":"application/json","X-Init-Data":INIT,
    "X-Telegram-Init-Data":INIT,"X-App-Key":APPKEY}};
  if(body!==undefined){o.method="POST";o.body=JSON.stringify(body);}
  const r=await fetch(path,o);
  let d=null;try{d=await r.json();}catch(err){}
  if(!r.ok){const e=new Error((d&&d.error)||(path+" "+r.status));e.status=r.status;e.data=d;throw e;}
  return d;
}
function adminAllowed(){return !LIVE || !!(ME&&ME.admin);}
function applyState(d){
  /* every list is replaced, even when empty — a new shop must never show demo data */
  if(d.features)Object.keys(d.features).forEach(k=>{if(k in FEAT)FEAT[k]=!!d.features[k];});
  if(d.content)Object.keys(d.content).forEach(k=>{if(k in CMS&&d.content[k]!=null)CMS[k]=d.content[k];});
  if(Array.isArray(d.stock)){STOCK.length=0;d.stock.forEach(x=>STOCK.push(x));FILTERED=STOCK.slice();}
  if(Array.isArray(d.orders)){ORDERS.length=0;d.orders.forEach(x=>ORDERS.push(x));}
  if(Array.isArray(d.tx)){TX.length=0;d.tx.forEach(x=>TX.push(x));}
  if(Array.isArray(d.feed))FEED=d.feed;
  if(d.earn)EARN=Object.assign({},EARN,d.earn);
  if(d.prefs)PREFS=Object.assign({},PREFS,d.prefs);
  if(Array.isArray(d.alerts))window.__alerts=d.alerts;
  if(d.store){
    STORE=Object.assign({},STORE,d.store);
    if(d.store.name)CFG.name=d.store.name;
    if(d.store.tag)CFG.tag=d.store.tag;
    document.querySelectorAll("[data-storename]").forEach(e=>e.textContent=CFG.name);
    document.querySelectorAll("[data-storetag]").forEach(e=>e.textContent=CFG.tag);
    document.title=CFG.name;
  }
  if(d.adm){
    ADM=Object.assign({},ADM,d.adm);
    if(Array.isArray(ADM.channels))
      CHANNELS=ADM.channels.map(c=>({id:c.id,name:c.name,handle:c.handle||"",
        req:!!c.required,on:!!c.active,members:"—"}));
    if(ADM.logs){
      LOGS_MASTER=!!ADM.logs.master;
      if(Array.isArray(ADM.logs.channels))
        LOGCH=ADM.logs.channels.map(c=>({id:c.id,name:c.name,handle:"",
          primary:!!c.primary,on:!!c.active}));
      if(Array.isArray(ADM.logs.events)&&ADM.logs.events.length)
        EVENTS=ADM.logs.events.map(e=>({k:e.label,on:!!e.on,ch:(LOGCH[0]||{}).id||1}));
    }
  }
  if(d.ratings)REVIEWS=d.ratings;
  if(typeof d.balance==="number")BAL=d.balance;
  if(d.me)ME=d.me;
  if(d.cart)CART=d.cart;
  if(d.wishlist)WISH=d.wishlist;
}
function showSwitch(on){
  const sw=document.getElementById("sw");
  if(sw)sw.style.display=on?"flex":"none";
}
var LOCK_TITLE="",LOCK_MSG="";
function lockedScreen(title,msg){
  LOCKED=true;LOCK_TITLE=title;LOCK_MSG=msg;
  showSwitch(false);
  paintLocked();
}
function paintLocked(){
  const st=document.getElementById("stage");
  if(st)st.innerHTML='<div class="card" style="margin:18px;text-align:center;padding:22px">'
    +'<h3 style="margin:0 0 8px">'+LOCK_TITLE+'</h3>'
    +'<p class="sub" style="margin:0 0 14px">'+LOCK_MSG+'</p>'
    +'<button class="btn block" onclick="location.reload()">Try again</button></div>';
  ["tabs","dock"].forEach(id=>{const e=document.getElementById(id);if(e)e.style.display="none";});
}
async function apiTry(path,body){
  try{return await api(path,body);}
  catch(e){toast(String(e&&e.message||e).slice(0,90));return null;}
}
async function refresh(){
  if(!LIVE)return;
  try{
    applyState(await api("/api/state"));
    applyCMS();applyFeatures();syncBal();render();renderAdmin();
  }catch(e){}
}
async function copyText(t, label){
  const txt=String(t||"");
  if(!txt){toast("Nothing to copy");return false;}
  try{
    if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(txt);}
    else{
      const ta=document.createElement("textarea");
      ta.value=txt;ta.setAttribute("readonly","");
      ta.style.cssText="position:fixed;left:-9999px;opacity:0";
      document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,txt.length);
      const ok=document.execCommand("copy");document.body.removeChild(ta);
      if(!ok)throw new Error("copy refused");
    }
    toast((label||"Copied")+": "+(txt.length>26?txt.slice(0,26)+"…":txt));
    return true;
  }catch(e){
    sheet(`<h3 style="margin:0 0 4px;font-size:1rem">Copy this</h3>
      <p class="sub">Your browser blocked the clipboard — select and copy.</p>
      <textarea class="inp" rows="3" readonly onclick="this.select()">${esc(txt)}</textarea>
      <button class="btn block" style="margin-top:10px" data-close>Done</button>`);
    return false;
  }
}
let STORE={upi:"",payee:"",prefix:"PAY",terms:"",support:""};
let PREFS={restock:true,receipts:true,promos:true,push:true};
let OFFER="";
function openPay(link){
  if(!link)return;
  try{
    if(TG&&TG.openLink&&/^https?:/.test(link))TG.openLink(link);
    else window.location.href=link;
  }catch(e){window.location.href=link;}
}
async function boot(){
  if(TG){try{TG.ready();TG.expand();}catch(e){}}
  const inTG=!!((INIT&&INIT.length)||(APPKEY&&APPKEY.length));
  if(inTG)showSwitch(false);              /* fail closed: no admin strip until proven */
  if(location.protocol==="file:")return;  /* opened as a plain file — demo gallery */
  let d;
  try{
    d=await api("/api/state");
  }catch(e){
    if(e&&e.status===401){
      let why="",fix="";
      try{
        const w=await (await fetch("/api/whoami",{headers:{"X-Init-Data":INIT,
          "X-Telegram-Init-Data":INIT,"X-App-Key":APPKEY}})).json();
        const R={missing:["Telegram did not pass your account to this page.",
                   "Open the bot and tap <b>Open Store</b>, or send <b>/app</b>."],
                 "bad-format":["The sign-in data arrived damaged.","Close the app and open it again from the bot."],
                 "no-hash":["The sign-in data arrived incomplete.","Close the app and open it again from the bot."],
                 "bad-hash":["The signature does not match this bot's token.",
                   "The page is served by a different bot, or BOT_TOKEN on the server has quotes around it. Send <b>/diag</b> in the bot to compare."],
                 stale:["That sign-in is older than the allowed window.","Reopen the app from the bot."],
                 "bad-user":["Your account details could not be read.","Reopen the app from the bot."],
                 "no-id":["Telegram sent no user id.","Reopen the app from the bot."]};
        const r=R[w.why]||["The store could not confirm who you are.","Open it again from the bot."];
        why=r[0]+" <code>("+(w.why||"unknown")+")</code>";
        fix=r[1];
      }catch(err){
        why="The store could not confirm who you are.";
        fix="Open it again from the bot with the <b>Open Store</b> button.";
      }
      lockedScreen("Cannot open the store",why+"<br><br>"+fix);
    }
    return;
  }
  applyState(d);LIVE=true;
  showSwitch(!!(ME&&ME.admin));           /* only a verified admin sees it */
  applyCMS();applyFeatures();syncBal();render();renderAdmin();
}
async function push(path,body,okMsg){
  if(!LIVE)return true;
  try{const r=await api(path,body);if(okMsg)toast(okMsg);return r;}
  catch(e){toast("Could not save — check your connection");return false;}
}
boot();
